name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 硬性约束：prod 只允许从 main 发 PR 合并。
  # GitHub 的分支保护无法原生表达这条规则，所以在这里用必过检查强制它。
  # 把本 job 加入 prod 的 Required status checks 即可生效。
  guard-prod-source:
    name: Guard prod source
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Only main may target prod
        # head_ref/base_ref 来自分支名，含有 " $ ; 等字符，直接插进 shell 会造成
        # 脚本注入（actionlint 的 expression 规则会报错）。一律经 env 传入。
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "base=${BASE_REF} head=${HEAD_REF}"
          if [ "${HEAD_REF}" != "main" ]; then
            echo "::error::只有 main 可以发 PR 到 prod（当前 head=${HEAD_REF}）"
            exit 1
          fi
          echo "OK: PR 来自 main"
